name: sahaba_health_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.4
  http: ^1.6.0
  google_generative_ai: ^0.4.7
  speech_to_text: ^7.4.0
  image_picker: ^1.2.2
  google_mlkit_text_recognition: ^0.15.1                   # <-- THÊM MỚI

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/sahaba_logo.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/sahaba_logo.jpg"
  min_sdk_android: 21